name: USMS monthly update

# Monthly nationwide refresh of recent USMS top-10 results. Old seasons don't change, so
# this re-crawls only the previous and current year (every LMSC and club), overwriting
# those years' CSVs under data/csv/usms/. It's ~1,800 requests, paced over 4 days:
#
#   - 1st of the month: start a new update crawl (fresh checkpoint)
#   - twice daily:      continue it; a no-op once the checkpoint says it's finished
#
# The checkpoint lives in data/usms/update/ so it never touches the full historical
# crawl's data/usms/crawl_state.json or clubs.json. It shares the usms-crawl concurrency
# group so the two never hit USMS at the same time.

on:
  schedule:
    - cron: "30 5 1 * *" # start
    - cron: "0 9,21 * * *" # continue
  workflow_dispatch:
    inputs:
      start:
        description: "Start a new update crawl now (otherwise continue the current one)"
        type: boolean
        default: false
      days:
        description: "Days to spread a new update over"
        type: number
        default: 4

permissions:
  contents: write

concurrency:
  group: usms-crawl
  cancel-in-progress: false

env:
  STATE: data/usms/update/state.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide start or continue
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          START: ${{ inputs.start }}
        run: |
          if [ "$SCHEDULE" = "30 5 1 * *" ] || [ "$START" = "true" ]; then
            echo "start=true" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$STATE" ] || python3 -c 'import json, os, sys; sys.exit(0 if json.load(open(os.environ["STATE"]))["finished"] else 1)'; then
            echo "Nothing to continue (no update in progress)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.mode.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scraper
        if: steps.mode.outputs.skip != 'true'
        run: pip install .

      - name: Run update slice
        if: steps.mode.outputs.skip != 'true'
        env:
          START: ${{ steps.mode.outputs.start }}
          DAYS: ${{ inputs.days || 4 }}
        run: |
          args=(--state "$STATE" --max-minutes 320 --debug-html)
          if [ "$START" = "true" ]; then
            args+=(--reset --days "$DAYS" --start-year $(( $(date -u +%Y) - 1 )))
          fi
          python -m usms_scraper.cli crawl "${args[@]}"

      - name: Commit results
        if: always() && steps.mode.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data/usms/update data/csv/usms; do
            [ -d "$d" ] && git add -A -- "$d"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          summary=$(python -c '
          import json, os
          s = json.load(open(os.environ["STATE"]))
          total = len(s["lmscs"]) * (s["end_year"] - s["start_year"] + 1) * len(s["courses"])
          p1, p2, n = len(s["phase1_done"]), len(s["phase2_done"]), s["requests_made"]
          y0, y1 = s["start_year"], s["end_year"]
          print(f"{y0}-{y1} phase1 {p1}/{total}, phase2 {p2}/{total}, {n} requests")
          ')
          git commit -m "USMS update: $summary" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Upload debug HTML
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: usms-update-debug
          path: data/csv/usms/debug
          if-no-files-found: ignore
