<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:image" content="{{ ogImage }}" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- tenant:color-vars -->
    <link rel="help" type="text/plain" href="/llms.txt" />
  </head>
  <body>
    <!-- Site Alert Banner (driven by Google Sheets content tab: key=alert_message) -->
    <div id="site-alert" class="site-alert" hidden>
      <span id="site-alert-text"></span>
      <button id="site-alert-dismiss" class="site-alert-dismiss" aria-label="Dismiss alert">&times;</button>
    </div>

    <!-- Navigation -->
    <nav id="main-nav">
      <div class="nav-inner">
        <a href="{{ page.homeHref }}" class="nav-logo">{{ shortName }}</a>
        <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
        <ul class="nav-links">
          <!-- tenant:page-nav -->
        </ul>
      </div>
    </nav>

    <!-- tenant:page-body -->

    <!-- Contact / Footer -->
    <footer id="contact">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-col">
            <!-- tenant:footer-address -->
          </div>
          <div class="footer-col">
            <h3>Connect</h3>
            <ul class="footer-links">
              <!-- tenant:footer-socials -->
            </ul>
          </div>
          <div class="footer-col">
            <h3>Resources</h3>
            <ul class="footer-links">
              <li><a href="https://www.usms.org/" target="_blank" rel="noopener">US Masters Swimming</a></li>
              <li><a href="#records">Team Records</a></li>
              <li><a href="#schedule">Practice Schedule</a></li>
              <!-- tenant:footer-resources -->
            </ul>
          </div>
        </div>
        <div class="footer-bottom">
          <p><!-- tenant:copyright --></p>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
    <script type="application/ld+json">
      <!-- tenant:json-ld -->
    </script>

  </body>
</html>
